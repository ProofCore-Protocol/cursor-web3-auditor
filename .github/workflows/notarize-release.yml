name: Notarize Release on TON

on:
  release:
    types: [published]

jobs:
  seal:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 🛡️ Cryptographically Seal Release Notes
        uses: ProofCore-Protocol/proofcore-action@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
